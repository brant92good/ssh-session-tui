[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-session-tui"
version = "0.4.0"
description = "A keyboard SSH machine picker with shared addresses and device-local routes"
requires-python = ">=3.12"
dependencies = ["textual==8.2.8"]
license = "MIT"

[project.scripts]
ssh-sessions = "ssh_sessions.cli:main"

[tool.setuptools.packages.find]
include = ["ssh_sessions*"]
