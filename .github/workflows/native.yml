name: Native Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
          - os: macos-14
            target: aarch64-apple-darwin
            rustflags: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare build toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt --target ${{ matrix.target }}
      - name: Prepare static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools openssh-server && sudo mkdir -p /run/sshd
      - run: cargo +1.94.0 fmt --check
      - run: cargo +1.94.0 test --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: cargo +1.94.0 clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - run: cargo +1.94.0 build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Compare legacy file formats and locks (developer check only)
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/ssh-sessions
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/check_native_compat.py --binary "$binary"
      - name: Fresh binary install, update and checksum rejection
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/ssh-sessions
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/check_native_install.py --binary "$binary" --with-path
      - name: Real local-shell handoff, interrupt, resize and return
        if: runner.os != 'Windows'
        shell: bash
        run: SSH_SESSIONS_NATIVE_BINARY="$PWD/target/${{ matrix.target }}/release/ssh-sessions" python tests/test_pty.py
      - name: Real SSH handoff through a private loopback sshd
        if: runner.os == 'Linux'
        run: python scripts/check_ssh_handoff.py --binary target/${{ matrix.target }}/release/ssh-sessions --sudo-sshd
      - name: Keep native build for installation checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssh-sessions-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ssh-sessions
            target/${{ matrix.target }}/release/ssh-sessions.exe
          if-no-files-found: error
      - name: Package immutable release files
        shell: bash
        run: python scripts/package_native.py --target '${{ matrix.target }}'
      - name: Keep release files and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish reviewed tag as a prerelease, never overwrite existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "SSH Sessions $GITHUB_REF_NAME" --notes-file docs/releases/native.md
  released-install:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prerelease
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Advertised HTTPS installer, update and checksum rejection
        shell: bash
        run: python scripts/check_release_install.py --version "${GITHUB_REF_NAME#v}"
