[package]
name = "ssh-session-tui"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A keyboard-first SSH machine picker"
repository = "https://github.com/brant92good/ssh-session-tui"

[lib]
name = "ssh_sessions"

[features]
screenshots = []

[[example]]
name = "capture"
required-features = ["screenshots"]

[[bin]]
name = "ssh-sessions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs2 = "0.4"
glob = "0.3"
shlex = "1"
dirs = "6"
which = "8"
ctrlc = "3"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
